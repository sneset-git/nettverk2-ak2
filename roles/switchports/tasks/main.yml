# Setter hver port i listen som access-port i riktig VLAN
- name: Konfigurer access-porter
  cisco.ios.ios_config:
    parents: "interface {{ item.interface }}"
    lines:
      - switchport mode access
      - "switchport access vlan {{ item.vlan }}"
      - spanning-tree portfast
    save_when: modified
  loop: "{{ access_ports | default([]) }}"

# Setter hver trunk-port med felles native VLAN
- name: Konfigurer trunk-porter
  cisco.ios.ios_config:
    parents: "interface {{ item }}"
    lines:
      - switchport mode trunk
      - "switchport trunk native vlan {{ native_vlan }}"
      - no shutdown
    save_when: modified
  loop: "{{ trunk_ports | default([]) }}"
