# Slår på den fysiske porten som går til switchen
- name: Aktiver trunk-porten
  cisco.ios.ios_config:
    parents: "interface {{ trunk_interface }}"
    lines:
      - no shutdown
  when: trunk_interface is defined

# Lager ett subinterface per VLAN, med HSRP for delt gateway
- name: Opprett subinterfaces med HSRP
  cisco.ios.ios_config:
    parents: "interface {{ trunk_interface }}.{{ item.vlan }}"
    lines:
      - "encapsulation dot1Q {{ item.vlan }}"
      - "ip address {{ item.ip }} {{ item.mask }}"
      - "standby version 2"
      - "standby {{ item.vlan }} ip {{ item.vip }}"
      - "standby {{ item.vlan }} priority {{ item.priority }}"
      - "standby {{ item.vlan }} preempt"
    save_when: modified
  loop: "{{ subinterfaces | default([]) }}"
  when: trunk_interface is defined
