# Port på R1 som går ned til S2-SW1 (trunk)
trunk_interface: GigabitEthernet0/0/1

# Subinterfaces med HSRP – vip er den delte gateway-adressen
subinterfaces:
  - vlan: 10
    ip: 192.168.10.4
    mask: 255.255.255.0
    vip: 192.168.10.1
    priority: 100
  - vlan: 20
    ip: 192.168.20.4
    mask: 255.255.255.0
    vip: 192.168.20.1
    priority: 100
  - vlan: 99
    ip: 10.0.22.2
    mask: 255.255.255.0
    vip: 10.0.22.1
    priority: 110
